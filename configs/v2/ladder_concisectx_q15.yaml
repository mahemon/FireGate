# v2 overlap ladder, the middle rung (v6, review add-on): the Concise reward (short, non-refusing answers) on the held-out
# Dolly requests that come with a context passage (closed QA, information extraction, summarization). About a third of
# the Dolly reference is such requests, so the tripwire can separate the new prompts from the rest of the reference but
# not from that part: a task in the middle of the separability scale (expected probe AUROC about 0.85; step v6.1
# measures it before any training). Data: scripts/prepare_ladder.py (concisectx_{train,test}.jsonl).
exp: v2_ladder_concisectx_q15
seed_dirs: true
model_path: models/Qwen2.5-1.5B-Instruct
data_dir: data
out_dir: runs
dtype: bfloat16
seed: 0
stream: [concisectx]

gate_layer: 8
lora:
  r: 16
  alpha: 32
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

gen:
  max_new_tokens: 512
  max_prompt_tokens: 1024
  eval_batch_size: 128
  rollout_batch_size: 128
  feature_batch_size: 32

grpo:
  steps: 150
  prompts_per_step: 16
  group_size: 8
  lr: 5.0e-5
  warmup_steps: 10
  grad_clip: 1.0
  micro_batch: 8
  temperature: 1.0
  ckpt_every: 25
  kl_beta: 0.01
  replay_frac: 0.25
  weight_decay: 0.0
  refkl_beta: 1.0
  refkl_batch: 32
  refkl_max_prompts: 1024
  olora_lambda: 0.5

tripwire:
  eps: 0.03
  delta: 0.05
  positions_per_traj: 48
  l2: 1.0e-4
  lbfgs_iters: 200
  fit_ref: {dolly: 600, advbench: 100, general: 900}
  cal_ref: {dolly: 700, advbench: 170, general: 700}

pools: {concisectx: 500, mmlu: 500, advbench: 250, xstest: 450, dolly: 400}

splits:
  rl: [0, 2400]
  fit_new: [2400, 3000]
  fit_old: [3000, 3300]   # not used (a single task never becomes an earlier task)
  cal_old: [3300, 3600]
