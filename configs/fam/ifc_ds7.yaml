# PLAN_SCALE.md: IF (format-constrained Dolly requests) with DeepSeek-LLM-7B-Chat (DeepSeek; open; weights converted to safetensors by
# scripts/prepare_data.py),
# LoRA (the main methods: Seq-GRPO, Tripwire-prompt). Task, data, splits, pools, GRPO and tripwire settings as
# configs/v2/ladder_ifc_q7.yaml; only the model, the gate layer and the batch sizes differ (the batch sizes only for memory).
# Full multi-head attention (no grouped KV heads), so the generation batch is halved; context 4096 tokens.
exp: fam_ifc_ds7
seed_dirs: true
model_path: models/deepseek-llm-7b-chat
data_dir: data
out_dir: runs
dtype: bfloat16
seed: 0
stream: [ifc]

gate_layer: 9            # of 30 blocks (about 0.29 of the depth, as 8 of 28 for Qwen2.5)
lora:
  r: 16
  alpha: 32
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

gen:
  max_new_tokens: 512
  max_prompt_tokens: 1024
  eval_batch_size: 32
  rollout_batch_size: 32
  feature_batch_size: 16

grpo:
  steps: 150
  prompts_per_step: 16
  group_size: 8
  lr: 5.0e-5
  warmup_steps: 10
  grad_clip: 1.0
  micro_batch: 2
  temperature: 1.0
  ckpt_every: 25
  kl_beta: 0.01
  replay_frac: 0.25
  weight_decay: 0.0
  refkl_beta: 1.0
  refkl_batch: 32
  refkl_max_prompts: 1024
  olora_lambda: 0.5

tripwire:
  eps: 0.03
  delta: 0.05
  positions_per_traj: 48
  l2: 1.0e-4
  lbfgs_iters: 200
  fit_ref: {dolly: 600, advbench: 100, general: 900}
  cal_ref: {dolly: 700, advbench: 170, general: 700}

# no stream-task pools other than nq; the reference / held-out pools are the same as the main experiment
pools: {ifc: 500, mmlu: 500, advbench: 250, xstest: 450, dolly: 400}

splits:
  rl: [0, 2400]
  fit_new: [2400, 3000]
  fit_old: [3000, 3300]
  cal_old: [3300, 3600]
